general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    # Real lock state for lock.sh
    on_lock_cmd = touch "$XDG_RUNTIME_DIR/hypr-locked"
    on_unlock_cmd = rm -f "$XDG_RUNTIME_DIR/hypr-locked"
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = rm -f "$XDG_RUNTIME_DIR/hypr-screen-off"; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; hyprctl eval 'require("modules.workspaces").sync()'
}

# Dim
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off. The marker tells monitors.lua to keep a monitor that reconnects
# in standby (the G34w drops HDMI when its signal goes off) turned off.
listener {
    timeout = 330
    on-timeout = touch "$XDG_RUNTIME_DIR/hypr-screen-off"; hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = rm -f "$XDG_RUNTIME_DIR/hypr-screen-off"; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; brightnessctl -r; hyprctl eval 'require("modules.workspaces").sync()'
}

# Suspend: on battery after 15 min (hibernates after 24 h, sleep.conf.d/10-hibernate.conf)
listener {
    timeout = 900
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 0 ] && systemctl suspend-then-hibernate
}

# Suspend: when charging after 1 h, never hibernates
listener {
    timeout = 3600
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 1 ] && systemctl suspend
}
