source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    color = $text
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = $subtext
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 8
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = JetBrainsMono Nerd Font
    check_color = $yellow
    fail_color = $red
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
