source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    # Draw right away instead of a blank frame while the screenshot loads
    immediate_render = true
}

# Password (PAM) and fingerprint (fprintd) work in parallel: type or touch the sensor
auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Touch the sensor to unlock
    fingerprint:present_message = Scanning…
    fingerprint:retry_delay = 250
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
}

label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    color = $text
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = $subtext
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 8
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    font_family = JetBrainsMono Nerd Font
    check_color = $yellow
    fail_color = $red
    capslock_color = $red
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

# Caps Lock warning (empty, so hidden, when off)
label {
    monitor =
    text = cmd[update:300] ~/.config/hypr/scripts/lockstatus.sh caps
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    color = $red
    position = 0, -100
    halign = center
    valign = center
}

# Battery: level, charging, time left
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lockstatus.sh battery
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = $subtext
    position = 0, 40
    halign = center
    valign = bottom
}

# Fingerprint status ("Touch the sensor…", or why it failed)
label {
    monitor =
    text = $FPRINTPROMPT
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    color = $subtext
    position = 0, -130
    halign = center
    valign = center
}

# Now playing (hidden when nothing plays). Control: Super+Alt+Space / . / ,
image {
    monitor =
    path = ~/.cache/media-art-none.png
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/media.sh lock-art
    size = 72
    rounding = 8
    border_size = 0
    position = 0, 150
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/media.sh lock-text
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    color = $text
    position = 0, 110
    halign = center
    valign = bottom
}
