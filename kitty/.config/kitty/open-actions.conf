# change to clicked directory and automatically ls
protocol file
mime inode/directory
action send_text all cd "${FILE_PATH}" && ls\r

# open text files in nvim in a new tab
protocol file
mime text/*
action launch --type=tab --cwd=current nvim ${FILE_PATH}

# Open any image in the full kitty window by clicking on it
protocol file
mime image/*
action launch --type=overlay kitten icat --hold -- ${FILE_PATH}
